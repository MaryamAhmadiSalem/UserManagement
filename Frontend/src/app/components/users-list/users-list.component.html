<app-header (searchEmitter)="searchUsers($event)"></app-header>
<div class="table-container">
  <table mat-table [dataSource]="userList()" class="users-table">
    @for (column of displayedColumns; track column) {
      <ng-container [matColumnDef]="column">
        <th mat-header-cell *matHeaderCellDef>{{ column }}</th>
        <td mat-cell *matCellDef="let user; let i = index">
          @if (column === 'row') {
            {{ i + 1 }}
          } @else if (column === 'action') {
            <div class="actionIcon">
              <svg lucidePen class="editIcon" (click)="editUser(user.id)"></svg>
              <svg lucideTrash class="deleteIcon" (click)="deleteUsers(user.id)"></svg>
            </div>
          } @else {
            {{ user[column] }}
          }
        </td>
      </ng-container>
    }
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <!-- @if( users$ | async ; as users){
  @for(user of users; track user.id){
    <p>{{user.firstName}}</p>
  }
} -->
</div>
