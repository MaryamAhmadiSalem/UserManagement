<header class="header">
  <span class="title">User List</span>
  <div class="searchBox">
    <app-logout></app-logout>
    <input
      appHighlight
      type="search"
      placeholder="Searching for users by national ID.."
      #nationalId
      (input)="onSearchInput(nationalId.value)"
    />
    <svg lucideSearch (click)="searchUsers(nationalId.value)"></svg>
  </div>
</header>
